name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "Test & Analyze"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: '3.0.0'
        
    - name: Install dependencies
      run: dart pub get
      
    - name: Run tests
      run: dart test
      
    - name: Run analyzer
      run: dart analyze --fatal-infos
      
    - name: Check formatting
      run: dart format --set-exit-if-changed .

  build:
    name: "Build Verification"
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: '3.0.0'
      
    - name: Install dependencies
      run: dart pub get
      
    - name: Verify build
      run: |
        echo "Building DeltaOS Core..."
        dart analyze --fatal-infos
