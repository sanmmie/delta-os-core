name: Lint and Code Quality

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit
    
    - name: Check undefined names
      run: |
        flake8 api config middleware models security services utils --select=F
    
    - name: Security scan with bandit
      run: |
        bandit -r api config middleware models security services utils -f json
