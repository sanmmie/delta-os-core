include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "build/**"
    - ".dart_tool/**"
    - "packages/**/.dart_tool/**"
    - "services/**"
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - prefer_final_locals
