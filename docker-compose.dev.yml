version: "3.8"

services:
  kernel-mock:
    image: python:3.11-slim
    command: ["python", "kernel-mock.py", "--host", "127.0.0.1", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./:/app
    working_dir: /app
    networks:
      - dev

  sample-node:
    image: python:3.11-slim
    command: ["python", "node-template/simple_node.py"]
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      - kernel-mock
    networks:
      - dev

networks:
  dev:
    driver: bridge
